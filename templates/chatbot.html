{% extends "base.html" %}

{% block title %}Flasky - Chatbot{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Chatbot</h1>
    <p>Signed in as {{ name }} ({{ email }})</p>
</div>

<div id="chat-log" class="well" style="height: 300px; overflow-y: auto;"></div>

<div class="input-group">
    <input type="text" id="message" class="form-control" placeholder="Type a message..." autocomplete="off">
    <span class="input-group-btn">
        <button type="button" id="send" class="btn btn-primary">Send</button>
    </span>
</div>

<a href="{{ url_for('logout') }}" class="btn btn-default" style="margin-top: 15px;">Logout</a>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    var log = document.getElementById("chat-log");
    var input = document.getElementById("message");

    function addLine(speaker, text) {
        var line = document.createElement("p");
        var who = document.createElement("strong");
        who.textContent = speaker + ": ";
        line.appendChild(who);
        line.appendChild(document.createTextNode(text));
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }

    function sendMessage() {
        var message = input.value.trim();
        if (!message) {
            return;
        }
        addLine("You", message);
        input.value = "";

        fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: message})
        })
            .then(function (response) { return response.json(); })
            .then(function (data) { addLine("Bot", data.reply); })
            .catch(function () { addLine("Bot", "Sorry, something went wrong."); });
    }

    document.getElementById("send").addEventListener("click", sendMessage);
    input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>
{% endblock %}
